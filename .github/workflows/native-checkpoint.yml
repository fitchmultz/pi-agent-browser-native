name: Native checkpoint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-checkpoint-linux:
    name: Native checkpoint Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: extension
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/pi
          ref: 97891a8511c101ef1cb53d72dfdcb60e0e2c0e89
          path: pi-host
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b1e083e345d0ed9c2c2f9f20953c657a2e0da8a8
          path: startup-baseline
          persist-credentials: false
      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libatomic1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.9.0'
          package-manager-cache: false
      - name: Prepare isolated sources and prerequisites
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git -C extension rev-parse HEAD)" = "$EXPECTED_HEAD"
          root=$(mktemp -d /tmp/piab-ci.XXXXXX)
          echo "CI_ROOT=$root" >> "$GITHUB_ENV"
          echo "CI_NODE_BIN=$(dirname "$(command -v node)")" >> "$GITHUB_ENV"
          cp -a extension pi-host startup-baseline "$root/"
          mkdir -m 700 "$root/home"
      - name: Build locked native host and download stock browser
        run: |
          env -i HOME="$CI_ROOT/home" TMPDIR=/tmp \
            PATH="$CI_NODE_BIN:/usr/local/bin:/usr/bin:/bin" \
            bash "$CI_ROOT/extension/scripts/ci-native-checkpoint.sh" setup "$CI_ROOT"
      - name: Allow the fixture Chrome to create its sandbox
        run: |
          # Chromium's documented Ubuntu 23.10+ filepath exception (option 2):
          # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
          # The native fixture copies the download into /tmp/piab-cp-*/home.
          # Keep that short socket root and Chrome's sandbox; do not relax userns globally.
          {
            apparmor_parser --version
            sysctl kernel.apparmor_restrict_unprivileged_userns
            chrome=("$CI_ROOT/home/.agent-browser/browsers"/chrome-*/chrome)
            [[ ${#chrome[@]} == 1 && -x ${chrome[0]} ]]
            sudo tee "$CI_ROOT/logs/chrome.apparmor" <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile $(basename "$CI_ROOT")-chrome /tmp/piab-cp-*/home/.agent-browser/browsers/chrome-*/chrome flags=(unconfined) {
            userns,
          }
          EOF
            # Load only our ephemeral profile, without reloading host policy or caching it.
            sudo apparmor_parser --add --skip-cache "$CI_ROOT/logs/chrome.apparmor"
          } 2>&1 | tee "$CI_ROOT/logs/sandbox-setup.log"
      - name: Default verification and all native checkpoints (no external network)
        run: |
          # Root only creates a loopback-only namespace, then drops all privileges.
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            exec setpriv --reuid="$1" --regid="$2" --clear-groups \
              env -i HOME="$3/home" TMPDIR=/tmp PATH="$4:/usr/local/bin:/usr/bin:/bin" \
              bash "$3/extension/scripts/ci-native-checkpoint.sh" verify "$3"
          ' -- "$(id -u)" "$(id -g)" "$CI_ROOT" "$CI_NODE_BIN"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && env.CI_ROOT != ''
        with:
          name: native-checkpoint-linux-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.CI_ROOT }}/logs/*
          if-no-files-found: error
          retention-days: 7
      - name: Remove only the fixture AppArmor profile
        if: always() && env.CI_ROOT != ''
        run: |
          if [[ -f "$CI_ROOT/logs/chrome.apparmor" ]]; then
            sudo apparmor_parser --remove --skip-cache "$CI_ROOT/logs/chrome.apparmor"
          fi
      - name: Remove isolated sources and fixtures
        if: always() && env.CI_ROOT != ''
        run: rm -rf -- "$CI_ROOT"
