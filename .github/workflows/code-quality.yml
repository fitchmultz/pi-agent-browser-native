name: Code quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mutations:
        description: Run synthetic mutation failure controls after clean quality acceptance
        type: boolean
        default: true
  workflow_call:
    inputs:
      source-ref:
        description: Exact source commit to verify; blank uses the triggering commit
        type: string
        default: ""
      mutations:
        description: Run synthetic mutation failure controls after clean quality acceptance
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.3"
          package-manager-cache: false
      - name: Use the repository package manager and locked dependencies
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Install current upstream for the command-reference check
        run: npm install --global agent-browser --allow-scripts=agent-browser
      - name: Select quality gate
        id: gate
        env:
          QUALITY_EVENT_NAME: ${{ github.event_name }}
          QUALITY_SOURCE_REF: ${{ inputs.source-ref }}
          QUALITY_MUTATIONS: ${{ inputs.mutations }}
          QUALITY_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node ./scripts/ci-code-quality.mjs
      - name: Strict quality acceptance
        if: steps.gate.outputs.script == 'quality'
        timeout-minutes: 15
        run: npm run quality
      - name: Strict quality acceptance and real failure controls
        if: steps.gate.outputs.script != 'quality'
        run: npm run quality:mutations
      - name: Install patched Node 22 for the unsupported-major diagnostic
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.5"
          package-manager-cache: false
      - name: Check doctor startup and unsupported-runtime diagnostic
        shell: bash
        run: |
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          node scripts/doctor.mjs --help > "$tmp/help"
          grep -F 'pi-agent-browser-doctor' "$tmp/help"
          pi_version=$(node --input-type=module -e 'import { MINIMUM_PI_VERSION } from "./scripts/doctor.mjs"; console.log(MINIMUM_PI_VERSION)')
          version=$(node --input-type=module -e 'import { TARGET_AGENT_BROWSER_VERSION } from "./scripts/agent-browser-target.mjs"; console.log(TARGET_AGENT_BROWSER_VERSION)')
          printf '#!/bin/sh\nprintf "%%s\\n" "%s"\n' "$pi_version" > "$tmp/pi"
          printf '#!/bin/sh\nprintf "agent-browser %%s\\n" "%s"\n' "$version" > "$tmp/agent-browser"
          chmod 755 "$tmp/pi" "$tmp/agent-browser"
          set +e
          PATH="$tmp:$PATH" node scripts/doctor.mjs --skip-source-check > "$tmp/report" 2>&1
          status=$?
          set -e
          cat "$tmp/report"
          test "$status" -eq 1
          grep -F '✗ Node running this doctor is unsupported: 22.23.5 (requires ^' "$tmp/report"
          grep -F '✓ agent-browser version ' "$tmp/report"
          grep -F "✓ Pi version satisfies the minimum runtime floor: $pi_version" "$tmp/report"
          test "$(grep -c '^✗ ' "$tmp/report")" -eq 1
          grep -F 'Pi may use a different runtime or Node executable' "$tmp/report"
          grep -F 'Doctor found setup failures.' "$tmp/report"
      - name: Checks must not rewrite maintained artifacts
        env:
          QUALITY_SOURCE_REF: ${{ inputs.source-ref || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$QUALITY_SOURCE_REF"
          git diff --exit-code
