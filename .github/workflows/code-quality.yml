name: Code quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      source-ref:
        description: Exact source commit to verify; blank uses the triggering commit
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.1"
          cache: false
      - name: Use the repository package manager and locked dependencies
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Install current upstream for the command-reference check
        run: npm install --global agent-browser --allow-scripts=agent-browser
      - name: Strict quality acceptance and real failure controls
        run: npm run quality:mutations
      - name: Checks must not rewrite maintained artifacts
        env:
          QUALITY_SOURCE_REF: ${{ inputs.source-ref || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$QUALITY_SOURCE_REF"
          git diff --exit-code
