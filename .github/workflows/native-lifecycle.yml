name: Native lifecycle

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      official-version:
        description: Official stable version resolved for this run; blank resolves latest
        type: string
        default: ""
      fork-ref:
        description: Maintained fork commit resolved for this run; blank resolves main
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: native-lifecycle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    uses: fitchmultz/.github/.github/workflows/resolve-hosts.yml@4bdc3d292095a7f04fbf034323cee05c8b3b8641 # main
    with:
      automation-ref: 4bdc3d292095a7f04fbf034323cee05c8b3b8641 # main
      official-version: ${{ inputs.official-version }}
      fork-ref: ${{ inputs.fork-ref }}

  native-lifecycle-linux:
    needs: resolve
    if: ${{ !cancelled() }}
    name: Native lifecycle Linux
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Require resolved latest hosts
        env:
          RESOLVE: ${{ needs.resolve.result }}
        run: test "$RESOLVE" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: extension
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/.github
          ref: 54c687228d840506555801b9db038373e697d901 # main
          path: automation
          persist-credentials: false
      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libatomic1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Use the package npm version
        run: npm install --global "$(node -p 'require("./extension/package.json").packageManager')"
      - name: Prepare isolated sources and prerequisites
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git -C extension rev-parse HEAD)" = "$EXPECTED_HEAD"
          root=$(mktemp -d /tmp/piab-ci.XXXXXX)
          echo "CI_ROOT=$root" >> "$GITHUB_ENV"
          echo "CI_NODE_BIN=$(dirname "$(command -v node)")" >> "$GITHUB_ENV"
          cp -a extension automation "$root/"
          mkdir -m 700 "$root/home"
      - name: Build latest native fixture host and download stock browser
        env:
          GH_TOKEN: ${{ github.token }}
          OFFICIAL_VERSION: ${{ needs.resolve.outputs.official-version }}
        run: |
          env -i HOME="$CI_ROOT/home" TMPDIR=/tmp OFFICIAL_VERSION="$OFFICIAL_VERSION" \
            GH_TOKEN="$GH_TOKEN" \
            PATH="$CI_NODE_BIN:/usr/local/bin:/usr/bin:/bin" \
            bash "$CI_ROOT/extension/scripts/ci-native-lifecycle.sh" setup "$CI_ROOT"
      - name: Allow the fixture Chrome to create its sandbox
        run: |
          # Chromium's documented Ubuntu 23.10+ filepath exception (option 2):
          # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
          # The native fixture copies the download into /tmp/piab-lc-*/home.
          # Keep that short socket root and Chrome's sandbox; do not relax userns globally.
          apparmor_parser --version
          sysctl kernel.apparmor_restrict_unprivileged_userns
          chrome=("$CI_ROOT/home/.agent-browser/browsers"/chrome-*/chrome)
          [[ ${#chrome[@]} == 1 && -x ${chrome[0]} ]]
          sudo tee "$CI_ROOT/logs/chrome.apparmor" <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile $(basename "$CI_ROOT")-chrome /tmp/piab-lc-*/home/.agent-browser/browsers/chrome-*/chrome flags=(unconfined) {
            userns,
          }
          EOF
          # Load only our ephemeral profile, without reloading host policy or caching it.
          sudo apparmor_parser --add --skip-cache "$CI_ROOT/logs/chrome.apparmor"
      - name: Documentation drift and native browser lifecycle (loopback only)
        run: |
          # Root only creates a loopback-only namespace, then drops all privileges.
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            exec setpriv --reuid="$1" --regid="$2" --clear-groups \
              env -i HOME="$3/home" TMPDIR=/tmp PATH="$4:/usr/local/bin:/usr/bin:/bin" \
              bash "$3/extension/scripts/ci-native-lifecycle.sh" verify "$3"
          ' -- "$(id -u)" "$(id -g)" "$CI_ROOT" "$CI_NODE_BIN"
      - name: Remove only the fixture AppArmor profile
        if: always() && env.CI_ROOT != ''
        run: |
          if [[ -f "$CI_ROOT/logs/chrome.apparmor" ]]; then
            sudo apparmor_parser --remove --skip-cache "$CI_ROOT/logs/chrome.apparmor"
          fi
      - name: Retain exact host and native lifecycle evidence
        if: always() && env.CI_ROOT != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-lifecycle
          path: ${{ env.CI_ROOT }}/logs
          if-no-files-found: error
          retention-days: 3
      - name: Remove isolated sources and fixtures
        if: always() && env.CI_ROOT != ''
        run: rm -rf -- "$CI_ROOT"
