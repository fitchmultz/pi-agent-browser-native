name: Native Windows

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Preserve committed line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install official upstream and browser
        run: |
          node -p "JSON.stringify({platform:process.platform,arch:process.arch,node:process.version})" | Tee-Object windows-environment.log
          git rev-parse HEAD | Tee-Object windows-environment.log -Append
          if ((git rev-parse HEAD) -ne $env:EXPECTED_HEAD) { throw 'Checkout does not match the requested head' }
          npm install --global agent-browser@0.37.0 2>&1 | Tee-Object windows-setup.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          agent-browser install 2>&1 | Tee-Object windows-setup.log -Append
          exit $LASTEXITCODE
      - name: Build and install packed package in Pi
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\platform-smoke\platform-build-windows.ps1 -PackageName 'pi-agent-browser-native' -NodeValidationMajor 22 2>&1 | Tee-Object windows-platform-build.log
          exit $LASTEXITCODE
      - name: Exercise native browser
        run: |
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\platform-smoke\browser-dogfood-windows.ps1 -AgentBrowserVersion '0.37.0' -SkipNpmCi 2>&1 | Tee-Object windows-browser-dogfood.log
          exit $LASTEXITCODE
      - name: Verify registration and browser evidence
        run: |
          $list = Get-Content -Raw .platform-smoke-runs/platform-build-*/pack/pi-list.stdout.txt
          if ($list -notmatch 'Project packages:[\s\S]*pi-agent-browser-native') { throw 'Packed package is not registered in Pi' }
          & .\node_modules\.bin\pi.cmd --version | Tee-Object windows-environment.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content -Raw .platform-smoke-runs/browser-dogfood-*/dogfood/dogfood.stdout.txt | ConvertFrom-Json
          $expected = 'qa-url', 'script-branch-and-aggregate', 'open-fresh-example', 'semantic-click-learn-more', 'semantic-click-url', 'open-current-example', 'job-open-assert-screenshot', 'close-session'
          if ($report.reports.Count -ne 8 -or (Compare-Object $expected @($report.reports.id))) { throw 'Missing browser proof' }
          if (@($report.reports | Where-Object { $_.isError -ne $false -or $_.resultCategory -ne 'success' }).Count) { throw 'Browser step failed' }
          $job = $report.reports | Where-Object id -eq 'job-open-assert-screenshot'
          $image = Get-Item $job.artifactPath
          if ($job.verifiedArtifact -ne $true -or $image.Length -le 0 -or $image.Length -ne $job.artifactSizeBytes) { throw 'Screenshot is not verified' }
          if ((git rev-parse HEAD) -ne $env:EXPECTED_HEAD) { throw 'Tested head changed' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Hosted native Windows evidence verified for $env:EXPECTED_HEAD; screenshot bytes=$($image.Length)" | Tee-Object windows-evidence.log
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: native-windows-${{ github.event.pull_request.head.sha || github.sha }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: |
            windows-*.log
            .platform-smoke-runs/platform-build-*/pack/*.txt
            .platform-smoke-runs/platform-build-*/pack/*.tgz
            .platform-smoke-runs/browser-dogfood-*/dogfood/*.txt
            ${{ runner.temp }}/pi-agent-browser-dogfood-artifacts-*/job.png
            ${{ runner.temp }}/pi-agent-browser-dogfood-artifacts-*/prewarm.html
