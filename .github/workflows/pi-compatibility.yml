name: Browser293 Windows fork observation (not qualification)

on:
  workflow_dispatch:
    inputs:
      reviewed-source-sha:
        description: Exact reviewed diagnostic commit; must equal this dispatch SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  windows-fork-observation:
    runs-on: windows-latest
    timeout-minutes: 70
    defaults:
      run:
        shell: bash
    env:
      REVIEWED_SOURCE_SHA: ${{ inputs.reviewed-source-sha }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Create new owned evidence root
        id: bootstrap
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync, mkdirSync, writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          const root = join(process.env.RUNNER_TEMP, `browser293-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`);
          mkdirSync(root);
          const evidence = join(root, 'evidence');
          mkdirSync(evidence);
          appendFileSync(process.env.GITHUB_ENV, `DIAGNOSTIC_ROOT=${root}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, 'owned=true\n');
          writeFileSync(join(evidence, 'bootstrap.json'), JSON.stringify({
            source:process.env.GITHUB_SHA, reviewed:process.env.REVIEWED_SOURCE_SHA,
            run:process.env.GITHUB_RUN_ID, attempt:process.env.GITHUB_RUN_ATTEMPT,
            node:process.version, classification:'New-input diagnostic only; not a production repair',
          }, null, 2) + '\n', {flag:'wx'});
          NODE
      - name: Verify original artifact metadata without mutation
        env:
          ARTIFACT_READ_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          set -o noclobber
          printf '{"captureStarted":true}\n' > "$DIAGNOSTIC_ROOT/evidence/preflight-capture-started.json"
          set +e
          node --input-type=module > "$DIAGNOSTIC_ROOT/evidence/preflight.stdout.log" 2> "$DIAGNOSTIC_ROOT/evidence/preflight.stderr.log" <<'NODE'
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          const root = process.env.DIAGNOSTIC_ROOT;
          const evidence = join(root, 'evidence');
          const save = (name, value) => writeFileSync(join(evidence, name), JSON.stringify(value, null, 2) + '\n', {flag:'wx'});
          try {
            save('status.json', {phase:'preflight', testInvocations:0, preparationFailure:true});
            assert.equal(process.platform, 'win32');
            assert.equal(process.version, 'v24.22.1');
            assert.match(process.env.REVIEWED_SOURCE_SHA, /^[a-f0-9]{40}$/);
            assert.equal(process.env.REVIEWED_SOURCE_SHA, process.env.GITHUB_SHA);
            assert.equal(process.env.GITHUB_REF, 'refs/heads/diagnostic/browser293-predecessor-observations');
            assert.equal(process.env.GITHUB_RUN_ATTEMPT, '1', 'No automatic/reused-attempt diagnostic execution');
            const response = await fetch('https://api.github.com/repos/fitchmultz/pi-agent-browser-native/actions/artifacts/12405769836', {
              headers:{Accept:'application/vnd.github+json', Authorization:`Bearer ${process.env.ARTIFACT_READ_TOKEN}`, 'X-GitHub-Api-Version':'2022-11-28'},
            });
            assert.equal(response.status, 200, 'Pinned original artifact unavailable; never rebuild/substitute');
            const metadata = await response.json();
            save('artifact-metadata.json', metadata);
            const expected = {id:12405769836, name:'browser-fork-host-93a39fcc50b7c460dbde1e3109bd798a37378852',
              size_in_bytes:11197443, digest:'sha256:9bc56574b33a603e6193a430644ab7a10d18d2fcc91dba7c5880fb87e7d4f46d',
              created_at:'2026-10-22T06:30:57Z', expires_at:'2026-10-29T06:30:56Z', expired:false};
            for (const [key, value] of Object.entries(expected)) assert.equal(metadata[key], value, `Changed artifact ${key}`);
            assert.equal(metadata.workflow_run.id, 39734295554);
            assert.equal(metadata.workflow_run.head_sha, '47eeb9a5b253a7eb297c663b2245f84d98b61d26');
            assert.ok(Date.now() < Date.parse(expected.expires_at));
            save('preflight-exit.json', {passed:true, metadataOnly:true, originalArtifactId:12405769836});
          } catch (error) {
            save('preflight-exit.json', {passed:false, error:{name:error.name, message:error.message}});
            throw error;
          }
          NODE
          status=$?
          set -e
          CAPTURE_EXIT="$status" node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          const shellExitCode = Number(process.env.CAPTURE_EXIT);
          writeFileSync(join(process.env.DIAGNOSTIC_ROOT, 'evidence', 'preflight-capture-exit.json'), JSON.stringify({
            shellExitCode, capturedStreamsClosed:shellExitCode === 0 || shellExitCode === 1,
          }, null, 2) + '\n', {flag:'wx'});
          NODE
          exit "$status"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          ref: ${{ inputs.reviewed-source-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: extension
          ref: 47eeb9a5b253a7eb297c663b2245f84d98b61d26
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fitchmultz/.github
          path: automation
          ref: 3d1b323fd602274c55e5f44692f24c8605e52b60
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '12405769836'
          repository: fitchmultz/pi-agent-browser-native
          run-id: '39734295554'
          merge-multiple: true
          path: ${{ env.DIAGNOSTIC_ROOT }}/fork-package
          github-token: ${{ github.token }}
      - name: Preserve native Windows module discovery
        shell: pwsh
        run: '"PSModulePath=$env:PSModulePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - name: Prepare base47 and execute one changed-input case
        id: observation
        working-directory: extension
        run: |
          set -uo pipefail
          set -o noclobber
          printf '{"captureStarted":true}\n' > "$DIAGNOSTIC_ROOT/evidence/driver-started.json"
          set +e
          node --input-type=module > "$DIAGNOSTIC_ROOT/evidence/preparation.stdout.log" 2> "$DIAGNOSTIC_ROOT/evidence/preparation.stderr.log" <<'NODE'
          import assert from 'node:assert/strict';
          import {spawnSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {closeSync, openSync, readFileSync, writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {availableParallelism, cpus, loadavg, totalmem} from 'node:os';
          import {fileURLToPath, pathToFileURL} from 'node:url';

          const root = process.env.DIAGNOSTIC_ROOT;
          const evidence = join(root, 'evidence');
          const source = join(process.env.GITHUB_WORKSPACE, 'extension');
          const control = join(process.env.GITHUB_WORKSPACE, 'control');
          const automation = join(process.env.GITHUB_WORKSPACE, 'automation');
          const target = 'test/agent-browser.managed-session-policy-lock.serial.test.ts';
          const base = '47eeb9a5b253a7eb297c663b2245f84d98b61d26';
          const fork = '93a39fcc50b7c460dbde1e3109bd798a37378852';
          const helpers = '3d1b323fd602274c55e5f44692f24c8605e52b60';
          const digest = bytes => createHash('sha256').update(bytes).digest('hex');
          const hash = path => digest(readFileSync(path));
          const save = (name, data) => writeFileSync(join(evidence, name), JSON.stringify(data, null, 2) + '\n');
          const errorData = error => ({name:error.name, message:error.message, code:error.code ?? null});

          let phase = 'preparation', testInvocations = 0;
          const state = {};
          try {
            assert.equal(process.platform, 'win32');
            assert.equal(process.version, 'v24.22.1');
            assert.equal(process.env.NODE_OPTIONS, undefined);
            assert.equal(process.env.NODE_PATH, undefined);
            let env;
            function git(directory, args) {
              const result = spawnSync('git', args, {cwd:directory, env, maxBuffer:64 * 1024 * 1024});
              if (result.stderr?.length) process.stderr.write(result.stderr);
              if (result.error) throw result.error;
              assert.equal(result.status, 0, 'Read-only/source-staging Git command failed');
              return result.stdout;
            }
            const head = directory => git(directory, ['rev-parse', 'HEAD']).toString().trim();
            assert.equal(process.env.REVIEWED_SOURCE_SHA, process.env.GITHUB_SHA);
            assert.equal(head(control), process.env.REVIEWED_SOURCE_SHA);
            assert.equal(head(source), base);
            assert.equal(head(automation), helpers);
            git(control, ['merge-base', '--is-ancestor', base, 'HEAD']);
            git(automation, ['diff', '--exit-code']);
            const helperFiles = {
              'scripts/common.mjs':'95453e156bdc75276a569aa0307ef31e640486ac9edcb7c6687bfce464e63f6a',
              'scripts/hosts.mjs':'efff778a0c0678eddb226da962cc65b64b64548a47be260017479d5991216c08',
            };
            const helperBytes = {};
            for (const [file, expected] of Object.entries(helperFiles)) {
              const canonical = git(automation, ['show', `${helpers}:${file}`]);
              assert.equal(digest(canonical), expected);
              const path = join(automation, file);
              const checkoutSha256 = hash(path);
              if (checkoutSha256 !== expected) writeFileSync(path, canonical);
              assert.equal(hash(path), expected);
              helperBytes[file] = {checkoutSha256, canonicalSha256:expected, executedSha256:hash(path)};
            }
            save('helper-bytes.json', helperBytes);
            git(automation, ['diff', '--exit-code']);
            const {isolatedEnvironment, run, writeJson} = await import(pathToFileURL(join(automation, 'scripts/common.mjs')));
            const {prepareHost, selectDevelopmentHost, hostIdentity} = await import(pathToFileURL(join(automation, 'scripts/hosts.mjs')));
            env = isolatedEnvironment(join(root, 'isolated'));
            const changed = git(control, ['diff', '--name-only', base, 'HEAD']).toString().trim().split(/\r?\n/).sort();
            assert.deepEqual(changed, ['.github/workflows/pi-compatibility.yml', target].sort());
            const baseline = git(source, ['show', `${base}:${target}`]);
            const observed = git(control, ['show', `HEAD:${target}`]);
            assert.equal(digest(baseline), '85f1769ed1b3c2afc30cfeff8bacb65c3bada1c4dd1d97ebe07fb2721385d5a1');
            assert.equal(digest(observed), '00381d7792c5239739694aeadcfa015435133872c078eb44b0ecb217e7eb4d5e');
            assert.equal(git(control, ['rev-parse', `HEAD:${target}`]).toString().trim(), 'a5564fdd9556e10374f9dc48794864beec9c04ee');
            writeFileSync(join(evidence, 'observation.diff'), git(control, ['diff', base, 'HEAD', '--', target]));
            const tracks = git(source, ['ls-files', '-z']).toString().split('\0').filter(Boolean);
            const snapshot = paths => Object.fromEntries(paths.map(path => [path, hash(join(source, path))]));
            const sourceBefore = snapshot(tracks.filter(path => path !== target));
            save('source-before.json', sourceBefore);
            save('inputs.json', {base, reviewedSource:head(control), helpers, fork,
              target, baseTestSha256:digest(baseline), observationTestSha256:digest(observed),
              node:{version:process.version, executable:process.execPath, platform:process.platform, arch:process.arch},
              hardware:{availableParallelism:availableParallelism(), logicalCpus:cpus().length, memoryBytes:totalmem()}, load:loadavg()});
            const packed = join(root, 'fork-package');
            const receiptBytes = readFileSync(join(packed, 'receipt.json'));
            const manifestBytes = readFileSync(join(packed, 'manifest.json'));
            assert.equal(receiptBytes.length, 4374);
            assert.equal(digest(receiptBytes), '5a7fc034e90724d305741d6e8781fd968fbf092371b2e41d5fc0e455d669c524');
            assert.equal(manifestBytes.length, 2730);
            assert.equal(digest(manifestBytes), '042b81f1d67ea7688eea23e24a55caf6a9b7c19d95fc453f9d4bc739dc605326');
            const receipt = JSON.parse(receiptBytes);
            assert.equal(receipt.ref, fork);
            assert.equal(receipt.artifactManifestSha256, digest(manifestBytes));
            writeFileSync(join(evidence, 'fork-receipt.json'), receiptBytes);
            writeFileSync(join(evidence, 'fork-manifest.json'), manifestBytes);
            const installHashes = {
              'package.json':'2fd1d8e13a217391d6f273b2f21e9b7dc561ed3b1d379d4e655e6c58de5838c6',
              'package-lock.json':'4872625b93d32fd3cb25809bc5f7c60960b17fd18c79ae902bc6bd0305a2d2fd',
              'install-lock/package.json':'9792b34aba5a94320fde5c68600eac4a5720d0d63ebc527d462bd125665b29ee',
              'install-lock/package-lock.json':'a414b5b5da041a67139b8deec096f3a37aa13f62a8202fe62f0f036aa37f9a94',
            };
            assert.deepEqual(receipt.installFiles, installHashes);
            for (const [file, expected] of Object.entries(installHashes)) assert.equal(hash(join(packed, file)), expected);
            const npmPhases = {beforeInstall:run('npm', ['--version'], {cwd:source, env}).trim()};
            run('npm', ['ci', '--ignore-scripts'], {cwd:source, env});
            const host = await prepareHost(join(root, 'host'), 'fork', packed, env);
            const selected = selectDevelopmentHost(source, host, env);
            const names = ['chord','pi-agent-core','pi-ai','pi-codemode','pi-coding-agent','pi-durable','pi-mcp','pi-telemetry','pi-tui'].map(name => '@earendil-works/' + name).sort();
            assert.deepEqual(Object.keys(selected.cohort).sort(), names);
            assert.ok(Object.values(selected.cohort).every(version => version === '1.4.0'));
            assert.equal(selected.version, '1.4.0');
            assert.equal(selected.companions.typebox, '1.3.37');
            assert.equal(selected.indexSha256, '8571698d27d098f224e684565fdf7bbcba72c0172b875adf59f0b7c088a94554');
            assert.equal(selected.cliSha256, '48de46271f1aebdcb42edb289d186793f4d0345510e25df0b0bec92251fdd160');
            writeJson(join(evidence, 'host.json'), {flavor:'fork', provenance:host.provenance, ...selected});
            const originalLock = '4872625b93d32fd3cb25809bc5f7c60960b17fd18c79ae902bc6bd0305a2d2fd';
            const originalGraph = 'ed73b152987bae31ea3e3ada1d3bfdc78de56c885911b228186444eee865c4d4';
            save('original-runtime-comparison.json', {originalLock, originalGraph,
              currentLock:selected.runtimeLockSha256, currentGraph:selected.runtimeGraphSha256,
              sameLock:selected.runtimeLockSha256 === originalLock, sameGraph:selected.runtimeGraphSha256 === originalGraph,
              interpretation:'Factual comparison only; graph equality and npm causality are not assumed.'});
            npmPhases.afterSelection = run('npm', ['--version'], {cwd:source, env}).trim();
            save('npm-phases.json', npmPhases);
            Object.assign(env, {PI_COMPAT_HOST:'fork', PI_COMPAT_EXPECTED_VERSION:selected.version,
              PI_COMPAT_EXPECTED_PACKAGE_DIR:selected.packageDir, PI_PACKAGE_DIR:selected.packageDir,
              PI_HOST_INDEX:selected.index, PI_HOST_CLI:selected.cli});
            run('npm', ['run', 'build'], {cwd:source, env});
            npmPhases.afterBuild = run('npm', ['--version'], {cwd:source, env}).trim();
            save('npm-phases.json', npmPhases);
            git(source, ['diff', '--exit-code']);
            assert.deepEqual(snapshot(tracks.filter(path => path !== target)), sourceBefore);
            const products = ['dist/extensions/agent-browser/index.js',
              'dist/extensions/agent-browser/lib/browser-execution-claim-storage.js',
              'dist/extensions/agent-browser/lib/browser-execution-claims.js',
              'dist/extensions/agent-browser/lib/process-identity.js', 'scripts/startup-measurement.mjs'];
            const before = snapshot(products);
            assert.equal(before[products[0]], '1cf8c5f1c6dd020824af15b5c320c05a10b89d173394911eec46433cad39150e');
            save('products-before.json', before);
            writeFileSync(join(source, target), observed);
            assert.equal(hash(join(source, target)), digest(observed));
            assert.deepEqual(git(source, ['diff', '--name-only']).toString().trim().split(/\r?\n/), [target]);
            assert.deepEqual(snapshot(products), before);
            // Resolve the project's public CLI from extension cwd; no SDK or loader substitute.
            const cli = fileURLToPath(import.meta.resolve('tsx/cli'));
            const args = [cli, '--test', '--test-concurrency=1', '--test-reporter=tap',
              '--test-name-pattern', '^competing cross-process reclaimers stay serialized after a stale claim$', target];
            save('test-command.json', {executable:process.execPath, args, scope:'one diagnostic case, not qualification'});
            phase = 'test';
            save('status.json', {phase, testInvocations, preparationFailure:false});
            let out, err, result;
            try {
              out = openSync(join(evidence, 'test.stdout.tap'), 'wx');
              err = openSync(join(evidence, 'test.stderr.log'), 'wx');
              testInvocations++;
              save('status.json', {phase, testInvocations, preparationFailure:false, executionState:'invocation-attempt'});
              result = spawnSync(process.execPath, args, {cwd:source, env, stdio:['ignore', out, err]});
            } catch (error) {
              result = {status:null, signal:null, error};
            } finally {
              if (out !== undefined) closeSync(out);
              if (err !== undefined) closeSync(err);
            }
            state.testExit = {code:result.status, signal:result.signal, error:result.error ? errorData(result.error) : null};
            save('test-exit.json', state.testExit);
            phase = 'post-test';
            const after = snapshot(products);
            save('products-after.json', after);
            assert.equal(hash(join(source, target)), digest(observed));
            assert.deepEqual(after, before);
            assert.deepEqual(snapshot(tracks.filter(path => path !== target)), sourceBefore);
            const finalHost = hostIdentity(source, env);
            save('host-after.json', finalHost);
            for (const key of ['runtimeGraphSha256','runtimeLockSha256','indexSha256','cliSha256']) assert.equal(finalHost[key], selected[key]);
            const lines = readFileSync(join(evidence, 'test.stdout.tap'), 'utf8').split(/\r?\n/);
            assert.ok(lines.includes('# tests 1'), 'Expected exactly one selected test');
            const records = lines.filter(line => line.startsWith('# {"stalePid":')).map(line => JSON.parse(line.slice(2).replace(/\\([\\#])/g, "$1")));
            assert.equal(records.length, 1, 'Missing/ambiguous target diagnostic record');
            const diagnostic = records[0];
            assert.equal(diagnostic.contenders.length, 4);
            const tapes = diagnostic.contenders.map(contender => {
              const records = contender.stderr.split(/\r?\n/).filter(line => line.startsWith('{"event":"identity-timing"')).map(line => JSON.parse(line));
              assert.equal(records.length, 1, 'Missing/ambiguous child timing record');
              return {peerOrdinal:contender.peerOrdinal, pid:contender.pid, ...records[0]};
            });
            state.observationComplete = tapes.every(tape => tape.omitted === 0 && tape.omittedLiveness === 0);
            save('target-correlations.json', {scope:'PID targets only; no immutable claim/token continuity or priority proof', diagnostic, tapes});
            phase = 'complete';
            save('status.json', {phase, testInvocations, preparationFailure:false, ...state});
            if (result.status !== 0 || result.error || result.signal || !state.observationComplete) process.exitCode = 1;
          } catch (error) {
            save('status.json', {phase, testInvocations, preparationFailure:testInvocations === 0, ...state, error:errorData(error)});
            console.error(error);
            process.exitCode = 1;
          }
          NODE
          status=$?
          set -e
          CAPTURE_EXIT="$status" node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          const shellExitCode = Number(process.env.CAPTURE_EXIT);
          writeFileSync(join(process.env.DIAGNOSTIC_ROOT, 'evidence', 'driver-exit.json'), JSON.stringify({
            shellExitCode, capturedStreamsClosed:shellExitCode === 0 || shellExitCode === 1,
            scope:'Preparation command terminal status; exact test code/signal/spawn error are in test-exit.json',
          }, null, 2) + '\n', {flag:'wx'});
          NODE
          exit "$status"
      - name: Finalize evidence after captured streams close
        if: ${{ always() && steps.bootstrap.outputs.owned == 'true' }}
        env:
          PRE_FINALIZE_JOB_STATUS: ${{ job.status }}
          OBSERVATION_OUTCOME: ${{ steps.observation.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          import {existsSync, lstatSync, readdirSync, readFileSync, writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          const evidence = join(process.env.DIAGNOSTIC_ROOT, 'evidence');
          const read = name => existsSync(join(evidence, name)) ? JSON.parse(readFileSync(join(evidence, name), 'utf8')) : null;
          const driver = read('driver-exit.json');
          const preflight = read('preflight-capture-exit.json');
          const status = read('status.json');
          const captureClosed = driver?.capturedStreamsClosed === true;
          const preflightClosed = preflight?.capturedStreamsClosed === true;
          const neverStarted = !existsSync(join(evidence, 'driver-started.json'));
          const preflightNeverStarted = !existsSync(join(evidence, 'preflight-capture-started.json'));
          writeFileSync(join(evidence, 'workflow-status.json'), JSON.stringify({
            preFinalizeJobStatus:process.env.PRE_FINALIZE_JOB_STATUS,
            observationStepOutcome:process.env.OBSERVATION_OUTCOME,
            status, driver, preflight, preparationStreamsClosed:captureClosed, preflightStreamsClosed:preflightClosed,
            preparationFailure:(status?.testInvocations ?? 0) === 0,
            interpretation:'Diagnostic only. Missing terminal capture or omitted observations are incomplete; never retry automatically.',
          }, null, 2) + '\n', {flag:'wx'});
          if ((!captureClosed && !neverStarted) || (!preflightClosed && !preflightNeverStarted)) {
            throw new Error('No proof all captured streams closed; preserve files without claiming a complete final manifest');
          }
          const files = readdirSync(evidence).sort().map(name => {
            const path = join(evidence, name);
            if (!lstatSync(path).isFile()) throw new Error('Unexpected evidence entry; no traversal or cleanup');
            const bytes = readFileSync(path);
            return {path:name, bytes:bytes.length, sha256:createHash('sha256').update(bytes).digest('hex')};
          });
          writeFileSync(join(evidence, 'SHA256-manifest.json'), JSON.stringify({
            scope:'All preceding evidence files after captured streams closed; excludes this manifest itself.', files,
          }, null, 2) + '\n', {flag:'wx'});
          NODE
      - name: Retain only new CI diagnostic evidence
        if: ${{ always() && steps.bootstrap.outputs.owned == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser293-windows-fork-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DIAGNOSTIC_ROOT }}/evidence
          if-no-files-found: error
          retention-days: 14
